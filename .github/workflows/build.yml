name: Build calendar

on:
  schedule:
    - cron: "17 12 * * *"   # about 5:17 AM Pacific
    - cron: "17 0 * * *"    # about 5:17 PM Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["events.json", "calendar.ics", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Build feed
        run: python3 build_calendar.py

      - name: Did the events change?
        id: diff
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          new = json.load(open("events.json", encoding="utf-8"))["events"]
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:events.json"], capture_output=True, text=True, check=True).stdout)["events"]
          except Exception:
              old = None
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("changed=%s\n" % ("true" if new != old else "false"))
          PY

      - name: Commit refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json calendar.ics wsmc-regional-calendar.html
          git commit -m "Refresh calendar data"
          git push

      - name: Assemble site
        run: |
          mkdir -p _site
          cp events.json calendar.ics _site/
          cp wsmc-regional-calendar.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Source health
        run: |
          python3 - <<'PY'
          import json, sys
          src = json.load(open("events.json", encoding="utf-8"))["sources"]
          bad = {k: v for k, v in src.items() if not v.get("ok")}
          print("sources:", src)
          if bad:
              print("::error::A calendar source failed; its last known events were carried forward:", bad)
              sys.exit(1)
          PY
